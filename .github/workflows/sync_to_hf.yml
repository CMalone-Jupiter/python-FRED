on:
  push:
    branches: [main]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs track "*.png" "*.jpg" "*.jpeg" "*.gif" "*.webp" "*.ico" "*.pdf" "*.zip"
          git add .gitattributes
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://CMalone-Jupiter:$HF_TOKEN@huggingface.co/spaces/CMalone-Jupiter/python-FRED
          git push hf main --force
