on:
  push:
    branches: [main]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install huggingface_hub
        run: pip install "huggingface_hub[hf_xet]"
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import shutil, os
          from huggingface_hub import HfApi

          api = HfApi(token='$HF_TOKEN')

          # Copy repo to a temp folder
          shutil.copytree('.', '/tmp/hf_upload', ignore=shutil.ignore_patterns(
              '.git', '.github', 'assets', 'README.md'
          ))

          # Rename HF_README.md to README.md
          os.rename('/tmp/hf_upload/HF_README.md', '/tmp/hf_upload/README.md')

          # Upload from temp folder
          api.upload_folder(
              folder_path='/tmp/hf_upload',
              repo_id='CMalone-Jupiter/python-FRED',
              repo_type='space',
              delete_patterns='*'
          )
          "
